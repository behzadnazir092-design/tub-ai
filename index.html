<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tub AI</title>
<style>body{background:#0f0f0f;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh;margin:0}header{padding:16px;text-align:center;border-bottom:1px solid #222;font-weight:700}#chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.msg{padding:10px 14px;border-radius:12px;max-width:80%;line-height:1.5}.user{background:#2563eb;align-self:flex-end}.ai{background:#1e1e1e;align-self:flex-start;border:1px solid #333}#bar{display:flex;padding:10px;gap:8px;border-top:1px solid #222}#q{flex:1;padding:12px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff}button{padding:12px 18px;border-radius:8px;border:0;background:#2563eb;color:#fff;font-weight:600}</style></head><body><header>Tub AI 🤖</header><div id="chat"><div class="msg ai">Salam! Kya puchna hai?</div></div><div id="bar"><input id="q" placeholder="Sawal likho..."><button onclick="send()">Send</button></div><script>
async function send(){let q=document.getElementById('q');let txt=q.value.trim();if(!txt)return;let chat=document.getElementById('chat');chat.innerHTML+=`<div class="msg user">${txt}</div>`;q.value='';chat.scrollTop=chat.scrollHeight;let d=document.createElement('div');d.className='msg ai';d.textContent='Soch raha hun...';chat.appendChild(d);try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt})});let j=await r.json();d.textContent=j.reply||j.error||'Error'}catch(e){d.textContent='Error: '+e.message}chat.scrollTop=chat.scrollHeight}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')send()})
</script></body></html>
